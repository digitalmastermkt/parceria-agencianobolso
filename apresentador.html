<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Modo apresentador</title>
<style>
:root{--fundo:#0E0E11;--cartao:#1C1C22;--linha:#3A3A44;--texto:#F4F1EC;--suave:#C9C6CF;--coral:#F0603A;--ouro:#F2B544;--ind:#2DD4BF;--ok:#4ADE80;--fs:1.12rem}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:var(--fs);line-height:1.6}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.entrar{max-width:420px;margin:12vh auto;padding:28px;background:var(--cartao);border:1px solid var(--linha);border-radius:18px}
.entrar h1{font-size:1.5rem;margin:0 0 6px}
.entrar p{color:var(--suave);margin:0 0 16px}
.entrar label{display:block;font-weight:700;margin:12px 0 6px}
.entrar input[type=password]{width:100%;min-height:48px;border-radius:12px;border:1.5px solid #8A8794;background:#0E0E11;color:var(--texto);padding:8px 12px}
.entrar .lembrar{display:flex;gap:10px;align-items:center;font-weight:500}
.entrar .lembrar input{width:20px;height:20px}
.btn{min-height:44px;border-radius:12px;border:1.5px solid var(--linha);background:#26262E;color:var(--texto);padding:8px 14px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#0E0E11}
.erro{color:#FFB4A0;font-weight:700;min-height:1.6em;margin:10px 0 0}
header{position:sticky;top:0;z-index:5;background:#15151A;border-bottom:1px solid var(--linha);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.qual{font-weight:800;font-size:1.05rem}
.qual small{display:block;font-weight:600;color:var(--suave);font-size:.85rem}
.relogio{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tempo{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.5rem}
.ritmo{font-weight:700;font-size:.92rem;padding:4px 10px;border-radius:999px;border:1.5px solid currentColor}
.ritmo.ok{color:var(--ok)}.ritmo.atr{color:#FFB4A0}.ritmo.adi{color:var(--ind)}
.ferr{display:flex;gap:8px;flex-wrap:wrap}
.con{font-size:.88rem;color:var(--suave)}
.con.on{color:var(--ok)}
main:focus{outline:none}
main{max-width:920px;margin:0 auto;padding:18px 16px 110px}
h1.tit{font-size:1.6rem;line-height:1.2;margin:6px 0 4px}
.meta{color:var(--suave);margin:0 0 12px}
.obj{background:#22222A;border-left:4px solid var(--coral);border-radius:8px;padding:8px 14px;margin:0 0 14px}
h2{font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin:18px 0 6px}
.fala p{margin:0 0 10px}
.cx{border-radius:12px;padding:10px 14px;margin:12px 0}
.cx.an{background:rgba(242,181,68,.12);border:1px solid rgba(242,181,68,.5)}
.cx.pq{background:rgba(45,212,191,.10);border:1px solid rgba(45,212,191,.5)}
.cx h2{margin:0 0 4px}
.cx.an h2{color:var(--ouro)}.cx.pq h2{color:var(--ind)}
.cx ul{margin:4px 0;padding-left:22px}
.sim{border:1px solid var(--linha);border-radius:12px;padding:10px 14px;margin:10px 0;background:#18181E}
.sim h3{margin:0 0 6px;font-size:1.05rem}
.sim p{margin:4px 0}
.dig{font-family:ui-monospace,Consolas,monospace;font-size:.95em;color:#FFD9C9}
.tr{font-style:italic;color:var(--suave)}
.nota{border-left:4px solid var(--ouro);padding:6px 12px;background:#1E1B12;border-radius:6px}
.antes{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:10px 16px;margin:0 0 16px}
.antes ul{margin:6px 0;padding-left:22px}
nav.pe{position:fixed;left:0;right:0;bottom:0;background:#15151A;border-top:1px solid var(--linha);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
nav.pe .btn{min-width:150px;min-height:52px;font-size:1.05rem}
.prox{color:var(--suave);font-size:.9rem;text-align:center;flex:1}
@media (max-width:560px){nav.pe .btn{min-width:0;flex:1}.prox{display:none}}
</style>
</head>
<body>
<div id="tela-senha">
 <main>
  <form class="entrar" id="form-senha">
   <h1>Modo apresentador</h1>
   <p>Roteiro da apresentação de parceria. Só para quem apresenta.</p>
   <label for="senha">Senha</label>
   <input type="password" id="senha" autocomplete="current-password" required>
   <label class="lembrar"><input type="checkbox" id="lembrar" checked> Lembrar neste computador</label>
   <p class="erro" id="erro" role="alert"></p>
   <button class="btn pri" type="submit">Abrir o roteiro</button>
  </form>
 </main>
</div>

<div id="tela-roteiro" hidden>
 <header>
  <div class="qual" aria-live="polite"><span id="h-num">Slide 1 de 20</span><small id="h-con" class="con">Apresentação não conectada</small></div>
  <div class="relogio">
   <span class="sr" id="rot-tempo">Tempo decorrido</span>
   <span class="tempo" id="tempo" aria-labelledby="rot-tempo">00:00</span>
   <span class="ritmo ok" id="ritmo">no ritmo</span>
   <button class="btn" type="button" id="b-tempo">Iniciar</button>
   <button class="btn" type="button" id="b-zerar">Zerar</button>
  </div>
  <div class="ferr">
   <button class="btn" type="button" id="b-menos" aria-label="Diminuir letra">A−</button>
   <button class="btn" type="button" id="b-mais" aria-label="Aumentar letra">A+</button>
   <button class="btn pri" type="button" id="b-abrir">Abrir a apresentação</button>
  </div>
 </header>
 <main id="conteudo" tabindex="-1"></main>
 <nav class="pe" aria-label="Trocar de slide">
  <button class="btn" type="button" id="b-ant">← Anterior</button>
  <span class="prox" id="prox"></span>
  <button class="btn pri" type="button" id="b-prox">Próximo →</button>
 </nav>
</div>

  var dados=null, atual=0, conectado=false, bc=null, inicio=null, acumulado=0, timer=null, fs=1.12;
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  async function abrir(senha){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PACOTE.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PACOTE.i)},key,b64(PACOTE.c));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function mmss(ms){var s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  function decorrido(){return acumulado+(inicio?Date.now()-inicio:0);}
  function previstoAte(i){var t=0;for(var k=0;k<=i;k++)t+=dados.slides[k].min;return t;}
  function previstoAntes(i){return previstoAte(i)-dados.slides[i].min;}
  function tick(){
    var d=decorrido();document.getElementById('tempo').textContent=mmss(d);
    var min=d/60000, r=document.getElementById('ritmo');
    if(!inicio&&!acumulado){r.className='ritmo ok';r.textContent='no ritmo';return;}
    if(min>previstoAte(atual)+0.5){r.className='ritmo atr';r.textContent='atrasado '+Math.ceil(min-previstoAte(atual))+' min';}
    else if(min<previstoAntes(atual)-1){r.className='ritmo adi';r.textContent='adiantado '+Math.floor(previstoAntes(atual)-min)+' min';}
    else {r.className='ritmo ok';r.textContent='no ritmo';}
  }
  function render(){
    var s=dados.slides[atual], n=dados.slides.length, h='';
    document.getElementById('h-num').textContent='Slide '+(atual+1)+' de '+n;
    if(atual===0) h+='<div class="antes"><h2>Antes de começar</h2><ul>'+dados.antes.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul></div>';
    h+='<h1 class="tit">'+(atual+1)+'. '+esc(s.titulo)+'</h1>';
    h+='<p class="meta">'+String(s.min).replace('.',',')+' min neste slide · termine até '+String(previstoAte(atual)).replace('.',',')+' min de apresentação</p>';
    h+='<p class="obj"><b>Objetivo:</b> '+esc(s.objetivo)+'</p>';
    h+='<h2>O que falar</h2><div class="fala">'+s.fala.map(function(f){return '<p>'+esc(f)+'</p>';}).join('')+'</div>';
    (s.simulacoes||[]).forEach(function(x){
      h+='<div class="sim"><h3>'+esc(x.nome)+'</h3><p><b>Digite:</b> <span class="dig">'+x.entradas.map(esc).join(' · ')+'</span></p><p><b>Resultado:</b> '+esc(x.resultado)+'</p>';
      if(x.depois) h+='<p><b>Depois:</b> <span class="dig">'+x.depois.map(esc).join(' · ')+'</span></p><p><b>Resultado:</b> '+esc(x.resultado2)+'</p>';
      h+='<p><b>Fala:</b> '+esc(x.fala)+'</p></div>';
    });
    h+='<div class="cx an"><h2>Analogia</h2><p>'+esc(s.analogia)+'</p></div>';
    h+='<div class="cx pq"><h2>Perguntas para o público</h2><ul>'+s.perguntas.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ul></div>';
    h+='<p><b>Na tela:</b> '+esc(s.tela)+'</p><p class="tr"><b>Passagem:</b> '+esc(s.transicao)+'</p>';
    if(s.nota) h+='<p class="nota">'+esc(s.nota)+'</p>';
    document.getElementById('conteudo').innerHTML=h;
    document.getElementById('prox').textContent=atual<n-1?'Próximo: '+dados.slides[atual+1].titulo:'Último slide';
    document.getElementById('b-ant').disabled=atual===0; document.getElementById('b-prox').disabled=atual===n-1;
    window.scrollTo(0,0); tick();
  }
  function ir(i){
    i=Math.max(0,Math.min(dados.slides.length-1,i));
    if(conectado&&bc){bc.postMessage({t:'ir',i:i});} else {atual=i;render();}
  }
  function iniciar(){
    document.getElementById('tela-senha').hidden=true; document.getElementById('tela-roteiro').hidden=false;
    render(); document.getElementById('conteudo').focus();
    try{bc=new BroadcastChannel('parceria-apresentador');bc.onmessage=function(e){var d=e.data||{};
      if(d.t==='slide'){conectado=true;var c=document.getElementById('h-con');c.textContent='Conectado à apresentação';c.className='con on';
        var k=-1;for(var j=0;j<dados.slides.length;j++){if(dados.slides[j].id===d.id)k=j;} if(k<0)k=d.i; if(k!==atual){atual=k;render();}}};
      bc.postMessage({t:'ping'});}catch(_){}
    setInterval(tick,1000);
  }
  document.getElementById('form-senha').addEventListener('submit',async function(e){
    e.preventDefault(); var s=document.getElementById('senha').value.trim(), er=document.getElementById('erro'); er.textContent='Abrindo…';
    try{dados=await abrir(s); er.textContent='';
      try{if(document.getElementById('lembrar').checked)localStorage.setItem('parceria-roteiro',s);else localStorage.removeItem('parceria-roteiro');}catch(_){}
      iniciar();}
    catch(_){er.textContent='Senha incorreta. Tente de novo.';}
  });
  (async function(){try{var s=localStorage.getItem('parceria-roteiro');if(s){dados=await abrir(s);iniciar();}}catch(_){}})();
  document.getElementById('b-ant').addEventListener('click',function(){ir(atual-1);});
  document.getElementById('b-prox').addEventListener('click',function(){ir(atual+1);});
  document.getElementById('b-abrir').addEventListener('click',function(){window.open('./','parceria-apresentacao');setTimeout(function(){try{bc&&bc.postMessage({t:'ping'});}catch(_){}} ,1500);});
  document.getElementById('b-tempo').addEventListener('click',function(){
    if(inicio){acumulado+=Date.now()-inicio;inicio=null;this.textContent='Continuar';}
    else{inicio=Date.now();this.textContent='Pausar';} tick();});
  document.getElementById('b-zerar').addEventListener('click',function(){inicio=null;acumulado=0;document.getElementById('b-tempo').textContent='Iniciar';tick();});
  function letra(d){fs=Math.max(.95,Math.min(1.6,fs+d));document.documentElement.style.setProperty('--fs',fs+'rem');}
  document.getElementById('b-mais').addEventListener('click',function(){letra(.08);});
  document.getElementById('b-menos').addEventListener('click',function(){letra(-.08);});
  document.addEventListener('keydown',function(e){
    if(!dados||document.getElementById('tela-roteiro').hidden)return; var t=e.target.tagName; if(t==='INPUT'||t==='BUTTON')return;
    if(['ArrowRight','ArrowDown','PageDown'].indexOf(e.key)>-1){e.preventDefault();ir(atual+1);}
    else if(['ArrowLeft','ArrowUp','PageUp'].indexOf(e.key)>-1){e.preventDefault();ir(atual-1);}
  });
})();
